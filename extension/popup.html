<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
:root{color-scheme:dark;--p:#6cdbad;--on:#003827;--s:#0f1512;--c:#1b211e;--t:#e0e9e2;--m:#aebbb2;--line:#89938b55}
*{box-sizing:border-box}body{width:300px;margin:0;background:var(--s);color:var(--t);font:13px/1.45 Roboto,"Segoe UI",sans-serif}.wrap{padding:16px}.head{display:flex;align-items:center;gap:10px;margin-bottom:14px}.mark{width:28px;height:28px;display:grid;place-items:center;border-radius:10px;background:var(--p);color:var(--on);font-weight:900;font-size:11px}.title{font-weight:800}.ver{font-size:10px;color:var(--m)}.dot{width:9px;height:9px;margin-left:auto;border-radius:50%;background:#69756d}.dot.on{background:var(--p);box-shadow:0 0 9px var(--p)}.dot.warn{background:#f6c453;box-shadow:0 0 9px #f6c453}.panel{padding:12px 14px;background:var(--c);border:1px solid var(--line);border-radius:18px;margin-bottom:12px}.row{color:var(--m);margin:6px 0}.mode{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px;margin:7px 0 10px}.mode-btn{padding:8px 4px;border:1px solid var(--line);border-radius:12px;background:transparent;color:var(--m);cursor:pointer;font-size:11px;font-weight:700}.mode-btn.active{background:var(--p);border-color:transparent;color:var(--on)}.project{display:none;grid-template-columns:1fr auto;gap:6px;margin:7px 0 10px}.project.show{display:grid}.project input{min-width:0;padding:8px;border:1px solid var(--line);border-radius:10px;background:#0b110e;color:var(--t);font:11px ui-monospace,monospace}.project button{padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--p);cursor:pointer;font-weight:700}.row.project-label{display:none}.row.project-label.show{display:block}.servers{white-space:pre-line;font:11px/1.6 ui-monospace,monospace;color:var(--m);max-height:88px;overflow:auto}.update{display:none;padding:12px 14px;margin:-2px 0 12px;background:#164c39;border:1px solid #6cdbad88;border-radius:18px;color:var(--p)}.update.show{display:block}.update b{display:block;color:var(--t);margin-bottom:3px}.update button{margin-top:8px;padding:7px 10px;background:var(--p);color:var(--on);border:0}.actions{display:grid;gap:8px}button{width:100%;padding:10px 12px;border-radius:999px;border:1px solid var(--line);cursor:pointer;font:700 12px inherit;transition:.15s}button:hover{filter:brightness(1.1);transform:translateY(-1px)}.ghost{background:transparent;color:var(--t)}.primary{background:var(--p);border-color:transparent;color:var(--on)}code{padding:2px 5px;border-radius:5px;background:#08100c;color:var(--p);font:11px ui-monospace,monospace}.hint{font-size:11px;color:var(--m);margin:12px 0 0}
</style>
</head>
<body><div class="wrap"><div class="head"><span class="mark">XW</span><span class="title">XW Studio <span id="ver" class="ver"></span></span><span id="dot" class="dot"></span></div><div class="panel"><div class="row">Режим работы</div><div class="mode"><button id="mode-roblox" class="mode-btn">Roblox</button><button id="mode-godot" class="mode-btn">Godot</button><button id="mode-terminal" class="mode-btn">Terminal</button></div><div id="project-label" class="row project-label">Папка проекта Godot</div><div id="project" class="project"><input id="godot-path" placeholder="Выберите папку проекта"><button id="godot-browse">Обзор</button></div><div class="row" id="state">Bridge: …</div><div class="row" id="tools"></div><div id="servers" class="servers"></div></div><div id="update" class="update"><b>Доступна новая версия XW Studio</b><span id="update-text"></span><button id="update-open">Открыть репозиторий</button></div><div class="actions"><button class="ghost" id="reconnect">↻ Переподключить bridge</button><button class="ghost" id="restart">⟳ Перезапустить bridge</button><button class="primary" id="settings">⚙ Настройки мультиагентов</button></div><p class="hint" id="hint">Выберите режим и запустите bridge.</p></div><script src="popup.js"></script></body></html>
